server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    types {
        application/wasm wasm;
    }

    gzip on;
    gzip_types application/wasm application/javascript application/octet-stream text/css;
    gzip_min_length 1024;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Engine files and packs: short cache with revalidation.
    location ~* \.(wasm|pck|js)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
