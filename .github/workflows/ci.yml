name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==4.*"
      - run: gdlint scripts tests
      - run: gdformat --check scripts tests

  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-bin "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j /tmp/templates.tpz "templates/web_*" -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"
      - run: godot --headless --version

      - name: Import project
        run: godot --headless --path . --import

      - name: Run tests
        timeout-minutes: 5
        run: godot --headless --path . --script res://tests/run_tests.gd

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html
          ls -la build/web
          {
            echo "### Web export"
            echo '```'
            du -h build/web/*
            echo "gzip size of the wasm: $(gzip -9c build/web/index.wasm | wc -c | numfmt --to=iec)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg GODOT_VERSION="$GODOT_VERSION" -t escape-from-occ:ci .
      - name: Smoke test /health, password and index
        run: |
          docker run -d --name occ -p 8080:80 -e BASIC_AUTH_USER=ci -e BASIC_AUTH_PASSWORD=ci-dummy escape-from-occ:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/health && break; sleep 1; done
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/)
          echo "index without password: HTTP $code"
          test "$code" = 401
          curl -fsS -u ci:ci-dummy -o /dev/null -w "index with password: HTTP %{http_code}\n" http://127.0.0.1:8080/
          curl -fsSI -u ci:ci-dummy http://127.0.0.1:8080/index.wasm | grep -i "content-type: application/wasm"

      - name: Container refuses to start without credentials
        run: |
          docker run -d --name occ-noauth escape-from-occ:ci
          sleep 3
          test "$(docker inspect -f '{{.State.Running}}' occ-noauth)" = "false"
          docker logs occ-noauth 2>&1 | grep "BASIC_AUTH_USER and BASIC_AUTH_PASSWORD must be set"
